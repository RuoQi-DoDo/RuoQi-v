name: Build app-miniapp

on:
  push:
    branches:
      - main
    paths:
      - frontend/apps/app-miniapp/pubspec.yaml
      - .github/workflows/build_app_miniapp.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-miniapp-build
  cancel-in-progress: false

env:
  VERSION_FILE: frontend/apps/app-miniapp/pubspec.yaml

jobs:
  detect_version:
    name: Detect pubspec version change
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      full_version: ${{ steps.version.outputs.full_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      flutter_version: ${{ steps.version.outputs.flutter_version }}
    steps:
      - uses: actions/checkout@v5

      - name: Compare current and previous version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail

          current=$(awk '$1 == "version:" { print $2; exit }' "$VERSION_FILE")
          current=${current%\"}
          current=${current#\"}
          current=${current%\'}
          current=${current#\'}

          if [[ -z "$current" ]]; then
            echo "No version field found in $VERSION_FILE" >&2
            exit 1
          fi

          version=${current%%+*}
          if [[ "$current" == *+* ]]; then
            build_number=${current#*+}
          else
            build_number=1
          fi

          flutter_version=$(python3 -c \
            'import tomllib; print(tomllib.load(open("mise.toml", "rb"))["tools"]["flutter"])')
          if [[ -z "$flutter_version" ]]; then
            echo "No tools.flutter version found in mise.toml" >&2
            exit 1
          fi

          # Manual runs always build the version currently on the selected branch.
          changed=true
          if [[ "$EVENT_NAME" == "push" && ! "$EVENT_BEFORE" =~ ^0+$ ]]; then
            if git fetch --no-tags --depth=1 origin "$EVENT_BEFORE"; then
              previous=$(git show "${EVENT_BEFORE}:${VERSION_FILE}" 2>/dev/null \
                | awk '$1 == "version:" { print $2; exit }')
              previous=${previous%\"}
              previous=${previous#\"}
              previous=${previous%\'}
              previous=${previous#\'}

              if [[ -n "$previous" && "$current" == "$previous" ]]; then
                changed=false
              fi
              echo "Previous version: ${previous:-<file did not exist>}"
            else
              echo "::warning::Could not fetch the previous commit; rebuilding to be safe."
            fi
          fi

          echo "Current version: $current"
          echo "Version changed: $changed"

          {
            echo "changed=$changed"
            echo "version=$version"
            echo "build_number=$build_number"
            echo "full_version=$current"
            echo "release_tag=v$current"
            echo "flutter_version=$flutter_version"
          } >> "$GITHUB_OUTPUT"

  android:
    name: Build Android packages
    needs: detect_version
    if: needs.detect_version.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.detect_version.outputs.flutter_version }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Build release APK
        working-directory: frontend/apps/app-miniapp
        env:
          APP_VERSION: ${{ needs.detect_version.outputs.version }}
          APP_BUILD_NUMBER: ${{ needs.detect_version.outputs.build_number }}
        run: |
          flutter build apk --release \
            --build-name="$APP_VERSION" \
            --build-number="$APP_BUILD_NUMBER"

      - name: Build release AAB
        working-directory: frontend/apps/app-miniapp
        env:
          APP_VERSION: ${{ needs.detect_version.outputs.version }}
          APP_BUILD_NUMBER: ${{ needs.detect_version.outputs.build_number }}
        run: |
          flutter build appbundle --release \
            --build-name="$APP_VERSION" \
            --build-number="$APP_BUILD_NUMBER"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-miniapp-android-${{ needs.detect_version.outputs.version }}-${{ needs.detect_version.outputs.build_number }}
          path: frontend/apps/app-miniapp/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload AAB
        uses: actions/upload-artifact@v7
        with:
          name: app-miniapp-android-aab-${{ needs.detect_version.outputs.version }}-${{ needs.detect_version.outputs.build_number }}
          path: frontend/apps/app-miniapp/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

  ios_build:
    name: Build iOS IPA
    needs: detect_version
    if: needs.detect_version.outputs.changed == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ needs.detect_version.outputs.flutter_version }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        working-directory: frontend
        run: flutter pub get

      - name: Check iOS distribution credentials
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          [[ -n "$IOS_CERTIFICATE_P12_BASE64" ]] \
            || missing+=("IOS_CERTIFICATE_P12_BASE64")
          [[ -n "$IOS_CERTIFICATE_PASSWORD" ]] \
            || missing+=("IOS_CERTIFICATE_PASSWORD")
          [[ -n "$IOS_PROVISIONING_PROFILE_BASE64" ]] \
            || missing+=("IOS_PROVISIONING_PROFILE_BASE64")

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing App Store distribution secrets: ${missing[*]}"
            exit 1
          fi

          echo "App Store distribution credentials found."

      - name: Install Apple certificate and provisioning profile
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          certificate_path="$RUNNER_TEMP/build_certificate.p12"
          profile_path="$RUNNER_TEMP/build_profile.mobileprovision"
          keychain_path="$RUNNER_TEMP/app-signing.keychain-db"
          keychain_password=$(openssl rand -hex 16)

          echo -n "$IOS_CERTIFICATE_P12_BASE64" | base64 --decode -o "$certificate_path"
          echo -n "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode -o "$profile_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$certificate_path" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -k "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Build signed IPA
        working-directory: frontend/apps/app-miniapp
        env:
          APP_VERSION: ${{ needs.detect_version.outputs.version }}
          APP_BUILD_NUMBER: ${{ needs.detect_version.outputs.build_number }}
        shell: bash
        run: |
          set -euo pipefail

          profile_path="$RUNNER_TEMP/build_profile.mobileprovision"
          team_id=$(security cms -D -i "$profile_path" \
            | plutil -extract TeamIdentifier.0 raw -o - -)
          profile_name=$(security cms -D -i "$profile_path" \
            | plutil -extract Name raw -o - -)
          application_identifier=$(security cms -D -i "$profile_path" \
            | plutil -extract Entitlements.application-identifier raw -o - -)
          profile_bundle_id="${application_identifier#*.}"
          project_file="ios/Runner.xcodeproj/project.pbxproj"
          # Do not call xcodebuild here. The project references Flutter's
          # generated Swift package, which does not exist on a clean runner
          # until flutter build prepares it.
          project_bundle_id=$(perl -ne '
            if (!$in_config
                && /^\s*[[:xdigit:]]{24} \/\* (?:Debug|Release|Profile) \*\/ = \{/) {
              $in_config = 1;
              $block = "";
            }
            $block .= $_ if $in_config;
            if ($in_config && /^\s*name = Release;$/) {
              if ($block =~ /INFOPLIST_FILE = Runner\/Info\.plist;/
                  && $block =~ /PRODUCT_BUNDLE_IDENTIFIER = ([^;]+);/) {
                print "$1\n";
                exit;
              }
              $in_config = 0;
            }
          ' "$project_file")

          if [[ -z "$project_bundle_id" ]]; then
            echo "Unable to read PRODUCT_BUNDLE_IDENTIFIER from the Xcode project." >&2
            exit 1
          fi

          case "$project_bundle_id" in
            $profile_bundle_id) ;;
            *)
              echo "Bundle ID mismatch: the app uses '$project_bundle_id', but the provisioning profile covers '$profile_bundle_id'." >&2
              exit 1
              ;;
          esac

          echo "Using provisioning profile: $profile_name"
          echo "Using Apple team: $team_id"
          echo "Using bundle ID: $project_bundle_id"

          # Flutter forwards FLUTTER_XCODE_* variables to xcodebuild. Override
          # signing there instead of rewriting project.pbxproj on the runner.
          export FLUTTER_XCODE_DEVELOPMENT_TEAM="$team_id"
          export FLUTTER_XCODE_PROVISIONING_PROFILE_SPECIFIER="$profile_name"

          export_options="$RUNNER_TEMP/ExportOptions.plist"
          cat > "$export_options" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${team_id}</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>${project_bundle_id}</key>
              <string>${profile_name}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF

          flutter build ipa --release \
            --build-name="$APP_VERSION" \
            --build-number="$APP_BUILD_NUMBER" \
            --export-options-plist="$export_options"

      - name: Upload signed IPA
        uses: actions/upload-artifact@v7
        with:
          name: app-miniapp-ios-ipa-${{ needs.detect_version.outputs.version }}-${{ needs.detect_version.outputs.build_number }}
          path: frontend/apps/app-miniapp/build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

  ios_upload:
    name: Upload iOS to App Store Connect
    needs:
      - detect_version
      - ios_build
    if: >-
      needs.detect_version.outputs.changed == 'true'
      && needs.ios_build.result == 'success'
    runs-on: macos-latest
    steps:
      - name: Check App Store Connect credentials
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          [[ -n "$APP_STORE_CONNECT_KEY_ID" ]] \
            || missing+=("APP_STORE_CONNECT_KEY_ID")
          [[ -n "$APP_STORE_CONNECT_ISSUER_ID" ]] \
            || missing+=("APP_STORE_CONNECT_ISSUER_ID")
          [[ -n "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" ]] \
            || missing+=("APP_STORE_CONNECT_PRIVATE_KEY_BASE64")

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing App Store Connect secrets: ${missing[*]}"
            exit 1
          fi

      - name: Download signed IPA
        uses: actions/download-artifact@v8
        with:
          name: app-miniapp-ios-ipa-${{ needs.detect_version.outputs.version }}-${{ needs.detect_version.outputs.build_number }}
          path: frontend/apps/app-miniapp/build/ios/ipa

      - name: Upload IPA to App Store Connect
        working-directory: frontend/apps/app-miniapp
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          ipas=(build/ios/ipa/*.ipa)
          if (( ${#ipas[@]} != 1 )); then
            echo "::error::Expected exactly one IPA, found ${#ipas[@]}."
            exit 1
          fi
          ipa="${ipas[0]}"

          file "$ipa"
          if ! unzip -tq "$ipa"; then
            echo "::error::$ipa is not a valid IPA archive."
            exit 1
          fi
          ipa_entries=$(unzip -Z1 "$ipa")
          if ! grep -Eq '^Payload/[^/]+\.app/Info\.plist$' <<< "$ipa_entries"; then
            echo "::error::$ipa does not contain Payload/<App>.app/Info.plist."
            exit 1
          fi

          private_keys_dir="$RUNNER_TEMP/appstoreconnect/private_keys"
          private_key="$private_keys_dir/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          private_key_raw="$RUNNER_TEMP/appstoreconnect/private_key.raw"
          mkdir -p "$private_keys_dir"
          echo -n "$APP_STORE_CONNECT_PRIVATE_KEY_BASE64" \
            | base64 --decode -o "$private_key_raw"
          tr -d '\000\r' < "$private_key_raw" > "$private_key"
          rm -f "$private_key_raw"
          chmod 600 "$private_key"

          if ! openssl pkey -in "$private_key" -noout >/dev/null 2>&1; then
            echo "::error::APP_STORE_CONNECT_PRIVATE_KEY_BASE64 does not decode to a valid App Store Connect .p8 private key."
            exit 1
          fi

          api_key_json="$RUNNER_TEMP/appstoreconnect-api-key.json"
          jq -n \
            --arg key_id "$APP_STORE_CONNECT_KEY_ID" \
            --arg issuer_id "$APP_STORE_CONNECT_ISSUER_ID" \
            --rawfile key "$private_key" \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key}' \
            > "$api_key_json"
          chmod 600 "$api_key_json"

          if grep -Fq '\u0000' "$api_key_json"; then
            echo "::error::App Store Connect API key JSON still contains a null byte."
            exit 1
          fi

          trap 'rm -f "$private_key" "$api_key_json"' EXIT

          echo "Uploading $ipa to App Store Connect with Transporter..."
          FASTLANE_SKIP_UPDATE_CHECK=true \
          fastlane pilot upload \
            --ipa "$ipa" \
            --api_key_path "$api_key_json" \
            --skip_submission true \
            --skip_waiting_for_build_processing true

  release:
    name: Publish GitHub Release
    needs:
      - detect_version
      - android
      - ios_upload
    if: >-
      github.event_name == 'push'
      && needs.detect_version.outputs.changed == 'true'
      && needs.android.result == 'success'
      && needs.ios_upload.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: app-miniapp-*
          path: release-files
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.detect_version.outputs.release_tag }}
          FULL_VERSION: ${{ needs.detect_version.outputs.full_version }}
        shell: bash
        run: |
          set -euo pipefail

          find release-files -maxdepth 1 -type f -print
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-files/* --clobber
          else
            gh release create "$RELEASE_TAG" release-files/* \
              --target "$GITHUB_SHA" \
              --title "app-miniapp $FULL_VERSION" \
              --notes "Automated mobile build for app-miniapp $FULL_VERSION."
          fi
