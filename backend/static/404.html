<!doctype html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>页面未找到 - RuoQi-v</title>
        <meta name="description" content="页面不存在或已失效" />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <header class="header">
        <div class="container">
            <nav class="nav">
                <a href="/index" class="logo">RuoQi-v</a>
                <ul class="nav-links">
                    <li><a href="/index">首页</a></li>
                    <li>
                        <a
                            href="/sys_api/admin/"
                            target="_blank"
                            rel="noopener noreferrer"
                            >后台</a
                        >
                    </li>
                </ul>
            </nav>
        </div>
    </header>
    <body>
        <main class="error-section" role="main">
            <div class="container">
                <article class="error-content" aria-labelledby="error-title">
                    <div class="error-icon" aria-hidden="true">🔍</div>
                    <h1 id="error-title" class="error-title">页面不存在</h1>

                    <p class="error-message">
                        抱歉，您访问的页面不存在或已失效。<br />
                        请检查地址是否正确，或返回首页继续访问。
                    </p>

                    <div class="error-code" role="status">
                        <strong>错误代码:</strong> 404
                    </div>

                    <nav class="action-buttons" aria-label="错误页面操作">
                        <a
                            href="/index"
                            class="btn btn-primary"
                            aria-label="返回网站首页"
                        >
                            返回首页
                        </a>
                        <button
                            onclick="history.back()"
                            class="btn btn-secondary"
                        >
                            返回上页
                        </button>
                    </nav>

                    <aside
                        class="suggestions"
                        aria-labelledby="suggestions-heading"
                    >
                        <h3 id="suggestions-heading">可能的原因</h3>
                        <ul>
                            <li>地址输入错误</li>
                            <li>页面已被移动或删除</li>
                            <li>服务暂时不可用</li>
                            <li>没有访问权限</li>
                        </ul>
                    </aside>
                </article>
            </div>
        </main>

        <footer class="footer">
            <a
                href="/sys_api/admin/"
                target="_blank"
                rel="noopener noreferrer"
                style="color: white; text-decoration: none"
                >Powered by RuoQi-v</a
            >
        </footer>
    </body>
</html>
