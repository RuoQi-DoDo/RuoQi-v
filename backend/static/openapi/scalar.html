<!DOCTYPE html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>RuoQi-v API 文档 - Scalar</title>
	<style>
		/* ---- 自定义顶部导航：品牌 + Home / Docs ---- */
		:root {
			--rq-topbar-h: 56px;
			/* 让 Scalar 为顶部固定导航预留垂直空间（内容/侧栏从导航下方开始） */
			--scalar-custom-header-height: var(--rq-topbar-h);
		}

		html,
		body {
			margin: 0;
			padding: 0;
		}

		body {
			font-family: var(--scalar-font, system-ui, -apple-system, "Segoe UI",
				Roboto, "Helvetica Neue", Arial, sans-serif);
		}

		/* 顶部品牌导航栏 */
		.doc-topbar {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			height: var(--rq-topbar-h);
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 0 20px;
			z-index: 9999;
			background: var(--scalar-background-1, #111);
			background: color-mix(in srgb, var(--scalar-background-1, #111) 88%, transparent);
			backdrop-filter: blur(10px);
			-webkit-backdrop-filter: blur(10px);
			border-bottom: 1px solid var(--scalar-border-color, rgba(255, 255, 255, 0.08));
			color: var(--scalar-color-1, #eee);
		}

		/* 左侧内容组：主题切换 = 品牌 + 导航 */
		.doc-left {
			display: flex;
			align-items: center;
			gap: 16px;
			min-width: 0;
		}

		/* 暗黑 / 亮色切换（右上角，与 Scalar 左下角原生切换保持一致的滑钮样式） */
		.cs-toggle {
			position: relative;
			display: inline-flex;
			align-items: center;
			width: 38px;
			height: 24px;
			border: 0;
			padding: 0;
			background: transparent;
			cursor: pointer;
			outline: none;
		}

		.cs-track {
			width: 100%;
			height: 12px;
			margin: 0 1px;
			border-radius: 9999px;
			background: var(--scalar-border-color, rgba(255, 255, 255, 0.18));
		}

		.cs-knob {
			position: absolute;
			top: 50%;
			left: 0;
			transform: translateY(-50%);
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 23px;
			height: 23px;
			border-radius: 9999px;
			background: var(--scalar-background-1, #111);
			border: 1px solid var(--scalar-border-color, rgba(255, 255, 255, 0.25));
			box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
			color: var(--scalar-color-1, #eee);
			transition: transform 0.3s ease-in-out;
		}

		/* 暗色时滑钮滑到右侧 */
		html[data-rq-mode="dark"] .cs-knob {
			transform: translateX(14px) translateY(-50%);
		}

		.cs-knob .icon {
			width: 12px;
			height: 12px;
		}

		.icon {
			width: 18px;
			height: 18px;
			display: inline-block;
		}

		/* 暗黑模式显示“月亮”，亮色模式显示“太阳” */
		html[data-rq-mode="dark"] .icon-sun,
		html[data-rq-mode="light"] .icon-moon {
			display: none;
		}

		.brand {
			display: flex;
			align-items: center;
			gap: 10px;
			text-decoration: none;
			color: var(--scalar-color-1, #eee);
		}

		.brand-mark {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 30px;
			height: 30px;
			border-radius: 9px;
			background: linear-gradient(135deg, #667eea, #764ba2);
			color: #fff;
			font-weight: 800;
			font-size: 16px;
			line-height: 1;
			box-shadow: 0 2px 8px rgba(102, 126, 234, 0.35);
		}

		.brand-name {
			font-weight: 700;
			font-size: 15px;
			letter-spacing: 0.3px;
			white-space: nowrap;
		}

		.topnav {
			display: flex;
			align-items: center;
			gap: 6px;
		}

		.topnav a {
			color: var(--scalar-color-2, #9aa);
			text-decoration: none;
			padding: 7px 14px;
			border-radius: 8px;
			font-size: 14px;
			font-weight: 500;
			white-space: nowrap;
			transition: color 0.2s, background 0.2s;
		}

		.topnav a:hover {
			color: var(--scalar-color-1, #eee);
			background: var(--scalar-background-2, rgba(255, 255, 255, 0.06));
		}

		.topnav a.active {
			color: var(--scalar-color-1, #eee);
			background: var(--scalar-background-2, rgba(255, 255, 255, 0.06));
			font-weight: 600;
		}

		@media (max-width: 560px) {
			.doc-topbar {
				padding: 0 12px;
			}

			.doc-left {
				gap: 10px;
			}

			.brand-name {
				font-size: 14px;
			}
		}

		/* ---- 干掉 Scalar 自带的顶部条，只保留上面这个品牌导航 ---- */
		.t-doc__header,
		.scalar-app .t-doc__header {
			display: none !important;
		}

		.scalar-app,
		:root,
		.scalar-api-references-standalone-mobile {
			--scalar-header-height: 0px !important;
		}

		/* 移除 Scalar 底部的 "Powered by Scalar"、MCP 引导 */
		.references-footer,
		.scalar-mcp-layer,
		.mcp-nav,
		.mcp-logo {
			display: none !important;
		}

		/* 精确隐藏 "Powered by Scalar" / "Powered By Scalar.com" 品牌文案
		   （侧栏底部与底部页脚；不误伤 scalar.com/<path> 等真实链接） */
		.scalar-app a[href="https://www.scalar.com"],
		.scalar-app a[href="https://scalar.com"] {
			display: none !important;
		}

		/* 移除左下角（侧栏底部）原生的样式切换开关 */
		.scalar-app button[class*="group/toggle"] {
			display: none !important;
		}
	</style>
</head>
<body>
	<!-- 顶部导航：暗黑/亮色切换 + Logo/品牌名 + Home / Docs -->
	<header class="doc-topbar">
		<div class="doc-left">
			<a class="brand" href="/index" title="RuoQi-v 首页">
				<span class="brand-mark">R</span>
				<span class="brand-name">RuoQi-v</span>
			</a>
			<nav class="topnav">
				<a href="/index" title="首页">Home</a>
				<a href="/static/scalar" class="active" title="API 文档">Docs</a>
			</nav>
		</div>
		<button class="cs-toggle" id="rqThemeToggle" type="button" role="switch"
			aria-checked="true" aria-label="切换暗黑 / 亮色模式" title="切换暗黑 / 亮色">
			<span class="cs-track" aria-hidden="true"></span>
			<span class="cs-knob" aria-hidden="true">
				<svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"
					stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<circle cx="12" cy="12" r="4"></circle>
					<path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
				</svg>
				<svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
					stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
					<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
				</svg>
			</span>
		</button>
	</header>

	<div id="app"></div>

	<!-- Load the Scalar API Reference script -->
	<script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>

	<!-- Initialize the Scalar API Reference -->
	<script>
		Scalar.createApiReference('#app', {
			// The URL of the OpenAPI/Swagger document
			url: '/static/openapi.json',
			// 与其它查看器保持一致的暗色主题
			theme: 'moon',
			// 默认暗色
			darkMode: true,
			// 隐藏 MCP 引导（Generate MCP 按钮）
			mcp: { disabled: true },
			// 隐藏 "Open API Client" 按钮
			hideClientButton: true,
		})
	</script>

	<!-- 自定义暗黑 / 亮色切换 -->
	<script>
		(function () {
			var btn = document.getElementById('rqThemeToggle')
			if (!btn) return

			function currentMode() {
				return document.body.classList.contains('dark-mode') ? 'dark' : 'light'
			}

			function syncIcon() {
				document.documentElement.setAttribute('data-rq-mode', currentMode())
				btn.setAttribute('aria-checked', currentMode() === 'dark' ? 'true' : 'false')
			}

			function setMode(mode) {
				var isDark = mode === 'dark'
				// 记录颜色模式偏好（与 Scalar 本身使用的 localStorage 键一致）
				try {
					localStorage.setItem('colorMode', isDark ? 'dark' : 'light')
				} catch (e) {}
				// 兜底：直接切换 body 上的主题类名
				document.body.classList.remove('dark-mode', 'light-mode')
				document.body.classList.add(isDark ? 'dark-mode' : 'light-mode')
				syncIcon()
			}

			btn.addEventListener('click', function () {
				setMode(currentMode() === 'dark' ? 'light' : 'dark')
			})

			// 初始同步，并跟随 Scalar 对 body 主题类名的修改
			syncIcon()
			new MutationObserver(syncIcon).observe(document.body, {
				attributes: true,
				attributeFilter: ['class'],
			})
		})()
	</script>
</body>
</html>
