<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>RuoQi-v API 文档</title>
	<script type="module" src="https://unpkg.com/rapidoc@latest/dist/rapidoc-min.js"></script>
	<style>
		body { margin: 0; background: #111; }
		.rq-topbar {
			height: 56px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 0 20px;
			box-sizing: border-box;
			background: #1e1e2e;
			color: #eee;
			font: 500 14px system-ui, -apple-system, sans-serif;
		}
		.rq-brand { color: #fff; font-weight: 700; text-decoration: none; }
		.rq-nav { display: flex; gap: 18px; }
		.rq-nav a { color: #cbd5e1; text-decoration: none; }
		.rq-nav a:hover, .rq-nav a.active { color: #fff; }
		rapi-doc { display: block; height: calc(100vh - 56px); }
	</style>
</head>
<body>
	<header class="rq-topbar">
		<a class="rq-brand" href="/index" title="RuoQi-v 首页">RuoQi-v</a>
		<nav class="rq-nav">
			<a href="/index">Home</a>
			<a href="/static/rapidoc" class="active">Docs</a>
		</nav>
	</header>
	<rapi-doc
		spec-url="/static/openapi.json"
		theme="dark"
		render-style="focused"
		schema-style="table"
		default-schema-tab="model"
		show-header="true"
		show-info="true"
		allow-spec-url-load="false"
		allow-spec-file-drag-and-drop="false"
		primary-color="#4f46e5"
		sort-tags="true"
		sort-endpoints-by="method"
		heading-text="RuoQi-v API"
	>
	</rapi-doc>
</body>
</html>
