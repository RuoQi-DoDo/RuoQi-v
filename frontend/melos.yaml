name: ruoqi_flutter_ui

packages:
  - apps/**
  - packages/**

scripts:
  get:
    run: flutter pub get
    description: Resolve dependencies for the whole workspace.
  analyze:
    run: melos exec -- flutter analyze
    description: Analyze all workspace packages.
  test:
    run: melos exec -- flutter test
    description: Run tests in all workspace packages.
  gen:
    run: melos exec --depends-on build_runner -- dart run build_runner build
    description: Regenerate json_serializable output in apps that use build_runner.
  run:platform_pc:
    run: melos exec --scope ruoqi_platform_pc --concurrency 1 -- flutter run
    description: Run the platform PC web app.
  run:business_app:
    run: melos exec --scope ruoqi_business_app --concurrency 1 -- flutter run
    description: Run the business mobile app (customer / merchant / partner).
  run:business_pc:
    run: melos exec --scope ruoqi_business_pc --concurrency 1 -- flutter run
    description: Run the business PC web app (customer / merchant / partner).
