name: ruoqi_app_miniapp
description: "RuoQi business mini-app host for customer, merchant and partner."
resolution: workspace
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.0
  encrypt: ^5.0.3
  json_annotation: ^4.12.0
  shared_preferences: ^2.5.3
  common:
    path: ../../packages/common
  network:
    path: ../../packages/network

dev_dependencies:
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true

  assets:
    - lib/miniapp/merchant/assets/images/
    - lib/miniapp/tospino/assets/

  fonts:
    - family: Inter
      fonts:
        - asset: lib/miniapp/tospino/assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: lib/miniapp/tospino/assets/fonts/Inter-Regular.ttf
          weight: 500
        - asset: lib/miniapp/tospino/assets/fonts/Inter-Medium.ttf
          weight: 600
        - asset: lib/miniapp/tospino/assets/fonts/Inter-Medium.ttf
          weight: 700
    - family: lightIconFont
      fonts:
        - asset: lib/miniapp/merchant/assets/fonts/lightIconFont.ttf
    - family: boldIconFont
      fonts:
        - asset: lib/miniapp/merchant/assets/fonts/boldIconFont.ttf
